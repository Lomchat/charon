name: CI

# Runs the protocol drift check, the Next build, the Drizzle migration suite
# against a temp DB, the Python agent compile + zipapp build, a strict
# `tsc --noEmit` pass, AND the unit test suites: vitest (TS server/runtime
# logic) + python unittest (agent event log, state, protocol, daemon
# integration). Plus a blocking production npm audit (high+) and a `docker`
# job that boots the full compose stack and probes it FROM THE HOST.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Pair the ends of both supported ranges (agent minimum is Python 3.10;
      # newest commonly deployed is 3.13) without doubling the job count.
      matrix:
        include:
          - node-version: '20'
            python-version: '3.10'
          - node-version: '22'
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the version-bump guard below diffs against the PR
          # base / the previous push (a depth-1 clone has neither).
          fetch-depth: 0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # tsc --noEmit, isolated from the Next build so failures are easy to
        # read. `next build` also runs the compiler but its output mixes TS
        # errors with bundler chatter.
        run: npm run typecheck

      - name: Unit tests (TypeScript)
        # vitest — server/runtime logic (event-log replay dedup, permission
        # isolation, login rate-limit, …). Pure modules, no Next lifecycle.
        run: npm test

      - name: Agent tests (Python)
        # stdlib unittest — durable event log, state load/save, protocol.
        run: npm run test:py

      - name: Test migrations on a temp DB
        # Verifies a fresh DB can apply every migration in order without
        # error (catches duplicate column adds, broken FK, etc.).
        run: DATABASE_URL=/tmp/charon-ci.db npm run db:migrate

      - name: Build Next.js
        # `build` also runs `check-protocol-sync.mjs` (prebuild via the npm
        # script). Covers TS + the Python↔TS protocol union check.
        env:
          NODE_ENV: production
          # Dummy secrets so any code that reads env at import time doesn't
          # crash during SSG. Charon doesn't actually use these — but a
          # missing env triggers `throw` in `lib/server/auth.ts`.
          SESSION_SECRET: ci-dummy-session-secret
          MASTER_PASSWORD: ci-dummy
          MASTER_SALT: ci-dummy-salt
          SYNC_TOKEN: ci-dummy-sync-token
        run: npm run build

      - name: Build agent .pyz
        # Validates the zipapp packaging (deterministic build — see build.sh).
        run: bash agent/build.sh

      - name: Committed .pyz is up to date
        # The build is byte-reproducible, so any diff here means someone
        # changed agent/charon_agent/ without rebuilding the committed dist —
        # which is what actually gets deployed, and whose embedded __version__
        # is read back as the fleet-update baseline (§14.6). A stale dist would
        # advertise the OLD version and deploy in a loop. Fail loudly.
        run: git diff --exit-code agent/dist/charon-agent.pyz

      - name: Python compile check
        # Catches SyntaxError / broken imports in the agent.
        run: python3 -m compileall -q agent/charon_agent

      - name: Agent change requires a __version__ bump
        # Fleet propagation is version-ORDERED (§14.6): a VPS updates only when
        # the hub ships a STRICTLY NEWER charon_agent.__version__. An agent
        # change without a bump therefore reaches nobody — and does so
        # silently, which is exactly the kind of failure CI should own.
        # One matrix leg is enough (pure git check).
        if: matrix.node-version == '20'
        run: |
          node scripts/check-agent-version-bump.mjs \
            "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}" \
            "${{ github.sha }}"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The self-hosting path had NO coverage at all, so every Docker-only
    # regression shipped silently. This job builds the image and boots the
    # real compose stack with the real `.env.example` values, then probes
    # /api/health **from the host**.
    #
    # That last word is the whole point: the container's own HEALTHCHECK curls
    # 127.0.0.1 from INSIDE, so it stays green even when the app binds the
    # container's loopback and the published port refuses every connection —
    # exactly what `HOST=127.0.0.1` (the correct bare-metal value, shipped in
    # .env.example and fed to the container by `env_file:`) used to cause.
    # Only a host-side probe can catch that class of bug.
    steps:
      - uses: actions/checkout@v7

      - name: .env from the shipped example (HOST=127.0.0.1 kept ON PURPOSE)
        # Real secrets, but the example's bind address: compose must override
        # it. Anything that reintroduces the trap fails the probe below.
        run: |
          {
            echo "MASTER_PASSWORD=ci-smoke-password"
            echo "MASTER_SALT=$(openssl rand -hex 32)"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "SYNC_TOKEN=$(openssl rand -hex 32)"
            echo "DATABASE_URL=./data/charon.db"
            echo "HOST=127.0.0.1"
            echo "PORT=10556"
            echo "NODE_ENV=production"
            echo "VAPID_SUBJECT=mailto:ci@example.com"
          } > .env

      - name: Resolved config binds 0.0.0.0
        # Cheap static assertion, independent of the runtime probe: proves the
        # `environment:` entry still wins over `env_file:`.
        run: docker compose config | grep -E 'HOST:\s*"?0\.0\.0\.0"?'

      - name: Build image + start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: /api/health answers on the PUBLISHED port
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:10556/api/health | grep -q '"ok":true'; then
              echo "health OK after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::/api/health is unreachable from the host — the container is probably bound to its own loopback"
          exit 1

      - name: Login page is served
        run: curl -fsS --max-time 10 http://127.0.0.1:10556/login | grep -qi 'charon\|password'

      - name: Server process is NOT root
        # The image has no `USER` (the entrypoint needs root to chown the bind
        # mounts) — this asserts the setpriv drop actually happened.
        #
        # The uid comes from procfs, NOT from `docker top`, for two reasons:
        #   - the daemon runs the host `ps` and parses its output, so it
        #     REJECTS any -eo format without a `pid` column ("Couldn't find PID
        #     field in ps output") — a step that dies before asserting anything;
        #   - even fixed, its `user` column is the HOST's name for the uid
        #     (`runner` on a GH runner, truncated to 8 chars elsewhere), which
        #     is not what we want to compare against.
        # /proc is always present, needs no procps in the image, and yields the
        # number itself.
        #
        # Matching on argv[0] is NOT cosmetic: Docker appends CMD to ENTRYPOINT,
        # so PID 1 (tini, ROOT) carries `/usr/bin/tini -- entrypoint.sh node
        # server.js` in its own cmdline, and /proc/1 sorts first — a substring
        # scan reports uid 0 and fails a perfectly correct drop. Same reason we
        # skip our own pid: this `sh -c` runs as root and its script text
        # contains "server.js" too.
        run: |
          docker top charon -eo pid,user,args || true
          uid=$(docker compose exec -T charon sh -c '
            self=$$
            for p in /proc/[0-9]*; do
              pid=${p#/proc/}
              [ "$pid" = "$self" ] && continue
              cmd=$(tr "\0" " " < "$p/cmdline" 2>/dev/null) || continue
              case "$cmd" in *server.js*) ;; *) continue ;; esac
              case "${cmd%% *}" in *node) ;; *) continue ;; esac
              grep "^Uid:" "$p/status" | cut -f2
              exit 0
            done
            exit 1' | tr -d '[:space:]')
          echo "server.js runs as uid: ${uid:-<not found>}"
          test -n "$uid" && test "$uid" != "0"

      - name: ~/.ssh is writable by the server user (host-key store)
        # charon_known_hosts must be creatable, else every VPS connection
        # re-accepts host keys forever.
        run: docker compose exec -T -u 1001 charon sh -c 'touch /home/charon/.ssh/.ci-probe && rm /home/charon/.ssh/.ci-probe'

      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  audit:
    runs-on: ubuntu-latest
    # BLOCKING (P2.16): a high/critical advisory on a production dependency
    # fails the run. For a genuinely unfixable transient advisory, add a
    # documented temporary allowlist via `npm audit --omit=dev --json` review
    # — don't flip this back to continue-on-error silently.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high
